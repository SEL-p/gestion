name: CI/CD production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Vérifier l’application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier le lint
        run: npm run lint

      - name: Construire Next.js
        env:
          DATABASE_URL: mysql://root:ci-password@127.0.0.1:3306/catalog_db
        run: npm run build

  publish:
    name: Publier l’image OCI
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Définir le nom d’image en minuscules
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l’image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest

  deploy:
    name: Déployer sur le VPS
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Déployer l’image par son SHA
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -p "${VPS_PORT:-22}" \
            "${VPS_USER}@${VPS_HOST}" \
            "sudo /usr/local/sbin/gestion-deploy.sh '$IMAGE'"
