version: '3.8'

services:
  app:
    build: .
    container_name: makaya_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:rootpassword@mysql:3306/catalog_db
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: makaya_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: catalog_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
